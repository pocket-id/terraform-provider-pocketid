name: CI

on:
  push:
    branches: [main, "v[0-9]+"]
  pull_request:
    branches: [main, "v[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated runs of a pull request but test every commit on main and the major version branches
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      provider: ${{ steps.filter.outputs.provider }}

    steps:
      - name: Detect changed areas
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # List the changed files, including the old path of renamed files
          all=false
          files=""
          case "$EVENT_NAME" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
              ;;
            push)
              # The compare API fails for force pushes and new branches, so fall back to running everything
              files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[]? | .filename, (.previous_filename // empty)') || all=true
              ;;
            *)
              all=true
              ;;
          esac

          # A change to the CI definition itself has to be validated by every job
          if grep -q -x '.github/workflows/ci.yml' <<< "$files"; then
            all=true
          fi

          # Top-level Markdown files and repository metadata don't affect the provider or its generated docs
          provider_files=$(grep -v -E '^[^/]+\.md$|^\.github/' <<< "$files" || true)
          if [ "$all" = true ] || grep -q . <<< "$provider_files"; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
          fi

          cat "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the only-new-issues option
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # tfplugindocs exports the provider schema with this Terraform instead of downloading one
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate docs
        run: make docs

      - name: Check generated docs are committed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git status --porcelain docs
            echo "::error::The generated docs are outdated. Run 'make docs' and commit the result."
            exit 1
          fi

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -v ./...

  acceptance-test:
    name: Acceptance tests
    needs: [changes, test]
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Start Pocket ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          ./scripts/prepare-test-db.sh

      - name: Run acceptance tests
        env:
          POCKETID_BASE_URL: http://localhost:1411
          POCKETID_API_TOKEN: test-terraform-provider-token-123456789
          TF_ACC: 1
        run: |
          # Use the Terraform installed above because the framework's auto-install breaks whenever HashiCorp's release signing key expires
          export TF_ACC_TERRAFORM_PATH="$(which terraform)"
          # Run the packages one after another because they share a single Pocket ID instance
          go test -v -timeout 30m -p 1 -tags=acc ./internal/...

      - name: Stop Pocket ID
        if: always()
        run: |
          # Wait for Pocket ID to exit because it keeps writing its SQLite files while shutting down
          pkill -f pocket-id || true
          for _ in $(seq 1 30); do
            pgrep -f pocket-id >/dev/null 2>&1 || break
            sleep 1
          done
          pkill -9 -f pocket-id 2>/dev/null || true
          rm -rf test-data

  # Runs against the next Pocket ID build to catch upcoming breaking changes without blocking pull requests
  acceptance-test-pocket-id-next:
    name: Acceptance tests (Pocket ID next)
    needs: [changes, test]
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      POCKET_ID_IMAGE: ghcr.io/pocket-id/pocket-id:next

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Start Pocket ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          ./scripts/prepare-test-db.sh

      - name: Run acceptance tests
        env:
          POCKETID_BASE_URL: http://localhost:1411
          POCKETID_API_TOKEN: test-terraform-provider-token-123456789
          TF_ACC: 1
        run: |
          export TF_ACC_TERRAFORM_PATH="$(which terraform)"
          go test -v -timeout 30m -p 1 -tags=acc ./internal/...

      - name: Stop Pocket ID
        if: always()
        run: |
          docker stop pocket-id-test || true
          docker rm pocket-id-test || true
          rm -rf test-data

  build-provider:
    name: Build provider
    needs: [changes, test]
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build provider binary
        run: |
          # Lay out the binary like a plugin directory for both registries so Terraform and OpenTofu install it without a registry
          for registry in registry.terraform.io registry.opentofu.org; do
            dir="artifact/plugins/$registry/pocket-id/pocketid/0.1.0/linux_amd64"
            mkdir -p "$dir"
            go build -o "$dir/terraform-provider-pocketid" .
          done

      - name: Upload provider artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-binary
          path: artifact/
          retention-days: 1

  compatibility:
    name: ${{ matrix.cli.name }} ${{ matrix.cli.version }} compatibility
    needs: [changes, build-provider]
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported and the latest release of each
        cli:
          - { name: Terraform, command: terraform, version: "1.5.7" }
          - { name: Terraform, command: terraform, version: "1.15.6" }
          - { name: OpenTofu, command: tofu, version: "1.6.3" }
          - { name: OpenTofu, command: tofu, version: "1.12.2" }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        if: matrix.cli.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.cli.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.cli.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.cli.version }}
          tofu_wrapper: false

      - name: Download provider artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-binary
          path: artifact

      - name: Install provider
        run: |
          mkdir -p ~/.terraform.d
          cp -r artifact/plugins ~/.terraform.d/
          chmod +x ~/.terraform.d/plugins/*/pocket-id/pocketid/0.1.0/linux_amd64/terraform-provider-pocketid

      - name: Start Pocket ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          ./scripts/prepare-test-db.sh

      - name: Apply and destroy the complete example
        working-directory: examples/complete
        env:
          CLI: ${{ matrix.cli.command }}
          TF_VAR_pocketid_base_url: http://localhost:1411
          TF_VAR_pocketid_api_token: test-terraform-provider-token-123456789
        run: |
          "$CLI" version
          "$CLI" init
          "$CLI" plan
          "$CLI" apply -auto-approve
          "$CLI" destroy -auto-approve

      - name: Stop Pocket ID
        if: always()
        run: |
          # Wait for Pocket ID to exit because it keeps writing its SQLite files while shutting down
          pkill -f pocket-id || true
          for _ in $(seq 1 30); do
            pgrep -f pocket-id >/dev/null 2>&1 || break
            sleep 1
          done
          pkill -9 -f pocket-id 2>/dev/null || true
          rm -rf test-data

  # The only check the ruleset requires, so jobs can be added, renamed or skipped without touching the ruleset
  ci-success:
    name: CI success
    needs: [changes, lint, docs, test, acceptance-test, build-provider, compatibility]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Skipped jobs are fine because they didn't apply to the changed files
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::At least one CI job failed or was cancelled"
              exit 1
            fi
          done
