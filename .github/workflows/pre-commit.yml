name: Pre-commit checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches: [ main, "release/**" ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read
      pull-requests: write

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
