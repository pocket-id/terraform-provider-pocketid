name: "🐛 Bug Report"
description: "Report something that is not working as expected"
title: "🐛 Bug Report: "
type: 'Bug'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out our bug report form 🙏
  - type: textarea
    id: steps-to-reproduce
    validations:
      required: true
    attributes:
      label: "Reproduction steps"
      description: "How do you trigger this bug? Please walk us through it step by step and include the configuration that triggers it."
      placeholder: "When I apply ..."
  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: "Expected behavior"
      description: "What did you think would happen?"
      placeholder: "It should ..."
  - type: textarea
    id: actual-behavior
    validations:
      required: true
    attributes:
      label: "Actual Behavior"
      description: "What did actually happen?"
      placeholder: "It actually ..."
  - type: markdown
    attributes:
      value: |
        ### Additional Information
  - type: input
    id: provider-version
    validations:
      required: true
    attributes:
      label: "Provider Version"
      description: "Please specify the version of the provider."
      placeholder: "e.g., v2.5.0"
  - type: input
    id: pocket-id-version
    validations:
      required: true
    attributes:
      label: "Pocket ID Version"
      description: "Please specify the version of Pocket ID."
      placeholder: "e.g., v2.19.0"
  - type: input
    id: terraform-version
    validations:
      required: true
    attributes:
      label: "Terraform or OpenTofu Version"
      description: "Please specify whether you use Terraform or OpenTofu and its version."
      placeholder: "e.g., Terraform 1.15.6 or OpenTofu 1.12.2"
  - type: textarea
    id: log-files
    validations:
      required: false
    attributes:
      label: "Log Output"
      description: "Output of the failing command, ideally run with TF_LOG=DEBUG. Remove API tokens and other secrets before posting."
      render: shell
  - type: markdown
    attributes:
      value: |
        **Before submitting, please check if the issue hasn't been raised before.**
